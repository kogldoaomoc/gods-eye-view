services:
  gods-eye-view:
    build: .
    # Everything the app writes (.env with your keys, .gev-cache, .gev-logs)
    # lands in the bind-mounted repo, so run as you, not root. UID/GID are
    # unset on Docker Desktop, where the 1000 fallback is ignored anyway.
    user: "${UID:-1000}:${GID:-1000}"
    # Forward explicit shell/.env policy before the launcher discovers a gateway.
    # Unset values stay unset so the default loopback-only install still works.
    environment:
      - GEV_KEY_SETUP_TRUSTED_PEERS
      - GEV_ALLOWED_HOSTS
    ports:
      # Publish to loopback only. Docker's default ("4173:4173") would bind
      # every host interface, which quietly turns the LAN warning in the README
      # into the default: this server brokers whatever provider keys you have
      # configured to anyone who can reach it. Widen this deliberately, not by
      # accident.
      - "127.0.0.1:4173:4173"
    volumes:
      # Bind the source so edits hot-reload and so keys pasted into the setup
      # UI land in the .env on your host instead of vanishing with the
      # container. node_modules stays in the image: sharp and friends are
      # compiled for Linux and must not be shadowed by a host install.
      - .:/app
      - /app/node_modules

  # Optional research sidecar for the Casefile layer (docs/CASEFILE.md). It runs
  # the research tools and files their findings into cases. Start it with
  # `docker compose --profile casefile up`; without the profile the app runs
  # exactly as before. Like the app, it is published to loopback only — it
  # brokers whatever tool access and keys you give it.
  casefile-bridge:
    profiles: ["casefile"]
    build: ./casefile-bridge
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # The app reaches the bridge over the compose network; the token is the
      # gate. Set CASEFILE_BRIDGE_TOKEN in your environment or .env.
      CASEFILE_BRIDGE_TOKEN: "${CASEFILE_BRIDGE_TOKEN:-}"
      GEV_URL: "http://gods-eye-view:4173"
      CASEFILE_STORE: "/app/.gev-cache/casefile"
    ports:
      - "127.0.0.1:7733:7733"
    volumes:
      # Share the app's cache dir so cases and raw output persist on the host.
      - .:/app
    command: ["serve", "--host", "0.0.0.0", "--port", "7733"]
