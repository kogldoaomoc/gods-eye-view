[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casefile-bridge"
version = "0.1.0"
description = "Local sidecar that runs research tools and files their findings into cases for God's Eye View."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Richer phone parsing and IP geolocation. The bridge runs without them, with
# reduced geographic precision.
geo = ["phonenumbers>=8.13", "geoip2>=4.8"]
dev = ["pytest>=8"]

[project.scripts]
casefile = "casefile.__main__:main"

[tool.setuptools.packages.find]
include = ["casefile*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
